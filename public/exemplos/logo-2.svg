<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="480" height="140" role="img" aria-label="Logo de exemplo, deitado">
  <!-- UM WORDMARK DEITADO, e a proporção é o ponto: 480 x 140 é a forma de um
       logo de verdade, e é a única que distingue `object-cover` de
       `object-contain`. O `logo-1.svg` é quadrado, então nele os dois saem
       IDÊNTICOS — o recorte que o pedido do logo proíbe não aparecia em imagem
       nenhuma. É a lição da duplicata do Cronograma. -->
  <rect width="480" height="140" rx="12" fill="#F2F7FA"/>
  <circle cx="70" cy="70" r="34" fill="#0267C1"/>
  <circle cx="70" cy="70" r="13" fill="#F2F7FA"/>
  <rect x="124" y="46" width="300" height="20" rx="10" fill="#15242C"/>
  <rect x="124" y="80" width="196" height="14" rx="7" fill="#545960"/>
</svg>
