# As rotinas diárias do Full Hub, para rodar À MÃO.
#
# ---------------------------------------------------------------------------
# **QUEM AGENDA É O `pg_cron`, E NÃO ESTE ARQUIVO** — decisão do usuário. O
# `schedule:` que estava aqui saiu, e o motivo é o custo que ele cobrava: a
# chave de serviço teria que morar num secret do repositório, e ela IGNORA TODO
# O RLS. Quem tem permissão de escrita aqui poderia lê-la escrevendo um
# workflow — é um push. Com o `pg_cron` o agendamento mora dentro do banco, a
# chamada nunca sai dele, e nenhuma chave é criada para isso.
#
# Quem liga é `scripts/agendar-rotinas.sql`, colado no SQL Editor uma vez. E o
# produto passou a SABER se ele está ligado: `rotinas_agendadas()` (0072) lê
# `cron.job`, e é ela que decide qual das duas frases a faixa de Recorrências e
# o bloco de rascunho da Home mostram. Pelo Actions isso não existiria — um
# secret de repositório é invisível para o Postgres.
#
# **E ESTE ARQUIVO FICA, sem o relógio.** Ele responde "ela rodou?" no dia em
# que alguém desconfiar, sem esperar a madrugada seguinte, e é o caminho de
# quem quer gerar as recorrências do dia agora. Apagá-lo custaria o
# `rodar-rotinas.sh` junto, que é onde está escrito como ler o HTTP 200 com o
# estrago dentro.
#
# Ele **continua pedindo os dois secrets** — é uma chamada HTTP ao PostgREST,
# como sempre foi. Sem eles termina em 0 dizendo o que falta, e o agendamento
# de madrugada não depende deles: aquele é do `pg_cron`.
# ---------------------------------------------------------------------------
name: Rotinas

on:
  # SÓ À MÃO. O `schedule:` saiu junto com a decisão de agendar pelo `pg_cron`;
  # deixá-lo aqui daria DOIS relógios para a mesma rotina, e a idempotência da
  # 0040 tornaria isso inofensivo e invisível — duas execuções por noite, com
  # metade dos logs em dois lugares diferentes.
  workflow_dispatch:

# Duas madrugadas não se atropelam. `gerar_ocorrencia()` é idempotente pelo
# índice único (0040), então o estrago seria pequeno — mas duas execuções
# concorrentes dariam dois logs contando histórias diferentes sobre a mesma
# noite, e é o log que se lê quando algo não nasceu.
concurrency:
  group: rotinas
  cancel-in-progress: false

jobs:
  diarias:
    name: Recorrências e limpeza de rascunhos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # SEM OS SECRETS ELE TERMINA EM 0, com o motivo no resumo do passo — a
      # mesma decisão do job `publicar`: uma Action vermelha todo dia por falta
      # de configuração é uma Action que a equipe aprende a ignorar, e aí o dia
      # em que ela fica vermelha DE VERDADE passa batido.
      - name: Há credencial?
        id: credencial
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            {
              echo "### Esta execução à mão não rodou"
              echo
              echo "Faltam os secrets \`SUPABASE_URL\` e \`SUPABASE_SERVICE_ROLE_KEY\`."
              echo
              echo "**O agendamento de madrugada NÃO depende disto** — ele é do \`pg_cron\`, por"
              echo "\`scripts/agendar-rotinas.sql\`. O que falta aqui é só o caminho de rodar as"
              echo "rotinas agora, sem esperar a noite."
              echo
              echo "Para conferir se o agendamento está de pé, rode no SQL Editor:"
              echo "\`select public.rotinas_agendadas();\` — ou olhe a faixa da aba Recorrências,"
              echo "que diz a mesma coisa em português."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "tem=nao" >> "$GITHUB_OUTPUT"
          else
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          fi

      # O MESMO ARQUIVO QUE ALGUÉM RODA À MÃO. Repetir os `curl` aqui dentro
      # daria duas rotinas: a que se testa e a que roda de madrugada.
      - name: Rodar as rotinas
        if: steps.credencial.outputs.tem == 'sim'
        run: bash scripts/rodar-rotinas.sh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
