# As verificações do projeto, num lugar só.
#
# Roda em todo push e em toda pull request — e o deploy CHAMA este mesmo
# arquivo antes de publicar. É por isso que ele tem `workflow_call`:
# um commit que reprova aqui nunca chega ao servidor, e a checagem que
# protege a produção é literalmente a mesma que roda no dia a dia, não uma
# cópia que envelhece em silêncio.
name: Verificar

on:
  push:
  pull_request:
  workflow_call:

jobs:
  codigo:
    name: Padrões, tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Padrões
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      # Contraste, cor literal fora dos tokens, classe de cor inexistente e
      # nome que saiu do produto. O último é o que mais justifica estar aqui:
      # "esse nome não existe mais" é critério que precisa ser conferido toda
      # vez, não uma vez.
      - name: Cores e vocabulário
        run: npm run check:cores

      # A recusa de validação tem que sair legível, em português e nomeando o
      # campo. O jeito antigo -- devolver `issues[0].message` cru -- mostrou
      # "Invalid input: expected string, received undefined" na tela de quem
      # usa o sistema. Voltar a ele é uma linha, e uma linha que parece igual
      # numa revisão: por isso a varredura roda toda vez.
      - name: Mensagens de validação
        run: npm run check:mensagens

      # Um `$$` escrito dentro de um comentário `--` de migration. Para o
      # Postgres não é nada; para quem separa os comandos antes de mandá-los
      # -- o SQL Editor do Supabase, um cliente gráfico, um script de deploy --
      # é a abertura de uma string, e a partir dali a contagem sai de
      # sincronia: o corpo da próxima função passa a ser lido como SQL solto.
      # O erro que aparece fala de outra coisa, três telas abaixo. Aconteceu na
      # 0032 e custou três tentativas de aplicar.
      - name: Migrations que sobrevivem ao separador de comandos
        run: npm run check:migrations

      # Valor exportado de arquivo "use client" chamado por Server Component.
      # O build, o lint e o tsc passam os tres -- o erro so nasce quando
      # alguem PEDE a pagina, e a resposta e um 500 seco. Foi assim que a
      # Gestao de Pessoas ficou fora do ar, e quem encontrou foi o usuario.
      - name: A fronteira servidor/cliente
        run: npm run check:fronteira

      - name: Contagem de dias do Full Days
        run: npm run check:dias

      # A trava que impede o Full Hub de mandar e-mail para cliente de
      # verdade fora de produção. Ela não quebra com erro quando some: ela
      # passa a FUNCIONAR — o build fica verde, o protótipo fica bonito, e a
      # primeira notícia é um cliente respondendo um e-mail de teste. E-mail
      # enviado não volta.
      - name: A trava do e-mail
        run: npm run check:email

      # Sem variável de ambiente nenhuma, e isso é deliberado: `lib/env.ts`
      # não lança no import justamente para o projeto compilar antes de as
      # credenciais existirem. Se um dia o build passar a exigir credencial,
      # é aqui que se descobre — e a resposta é consertar o acoplamento, não
      # colar uma chave de verdade num arquivo que vai para o repositório.
      - name: Build
        run: npm run build

  banco:
    name: Bateria de RLS
    runs-on: ubuntu-latest

    # Postgres 16 de verdade, não um dublê: a bateria testa RLS, trigger e
    # função plpgsql, e nada disso existe fora de um Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: bateria
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Cliente do Postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Rodar os cenários
        run: supabase/testes/rodar.sh
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: bateria
