# O self deploy: push na main → VPS da Hostinger.
#
# ============================================================================
# A VPS NÃO EXISTE MAIS, e é decisão da agência.
#
# O job `verificar` continua valendo e continua rodando: ele é a metade que
# nunca dependeu de máquina nenhuma. O job `publicar` não faz nada — o passo
# "Os segredos da VPS existem?" não os encontra, escreve no resumo e termina
# em 0, de propósito, para a Action não ficar vermelha por um motivo que
# ninguém pediu.
#
# O arquivo fica em vez de ser apagado: um deploy apagado não volta de graça
# no dia em que houver outra máquina, e o que está escrito aqui é por que cada
# passo está nesta ordem. A lista do que ficou inerte está na seção Deploy do
# CLAUDE.md.
# ============================================================================
#
# COMO FUNCIONAVA
#   1. roda as mesmas verificações do dia a dia (lint, tipos, cores, build,
#      e os 319 cenários da bateria contra um Postgres 16 de verdade);
#   2. só se tudo passar, entra por SSH na VPS e chama scripts/deploy.sh.
#
# A ordem é o ponto. O deploy na VPS faz `npm ci` antes de construir, e é
# nesse instante que o node_modules do processo que está NO AR é reescrito.
# Um commit quebrado que chegasse até lá poderia derrubar o painel antes
# mesmo de o build falhar. Verificando antes, isso não acontece.
#
# O QUE ELE NÃO FAZ
#   Não aplica migration. Está explicado em scripts/deploy.sh.
name: Deploy

on:
  push:
    branches: [main]
  # Para republicar sem precisar de um commit novo — útil depois de mexer no
  # .env.local da VPS, que o Next só lê quando sobe.
  workflow_dispatch:

# Um deploy por vez, e sem cancelar o que está no meio: `cancel-in-progress`
# aqui poderia matar a Action entre o `npm ci` e o build, deixando a VPS com
# as dependências novas e o build velho.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  verificar:
    uses: ./.github/workflows/verificar.yml

  publicar:
    name: Publicar na VPS
    needs: verificar
    runs-on: ubuntu-latest

    # Amarre segredos e (se quiser) aprovação manual a este ambiente, em
    # Settings → Environments → producao.
    environment: producao

    steps:
      # A VPS ainda não está ligada ao GitHub? Então não há o que publicar, e
      # isso não é uma falha — é um estado legítimo do projeto.
      #
      # Sem esta checagem, o primeiro push na `main` já daria X vermelho no
      # repositório por um motivo que ninguém pediu ainda. E um X vermelho
      # que significa "você não configurou isso" ensina todo mundo a ignorar
      # X vermelho, que é o jeito mais rápido de um erro de verdade passar
      # batido depois.
      - name: Os segredos da VPS existem?
        id: configurado
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USUARIO: ${{ secrets.VPS_USER }}
          CHAVE: ${{ secrets.VPS_SSH_KEY }}
          CHAVE_DO_HOST: ${{ secrets.VPS_HOST_KEY }}
        run: |
          faltando=""
          [ -n "$HOST" ]          || faltando="$faltando VPS_HOST"
          [ -n "$USUARIO" ]       || faltando="$faltando VPS_USER"
          [ -n "$CHAVE" ]         || faltando="$faltando VPS_SSH_KEY"
          [ -n "$CHAVE_DO_HOST" ] || faltando="$faltando VPS_HOST_KEY"

          if [ -z "$faltando" ]; then
            echo "pronto=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "pronto=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploy não configurado"
            echo
            echo "As verificações passaram, e não há para onde publicar:"
            echo "a agência não tem mais a VPS. Isto **não é uma falha**."
            echo
            echo "Faltam os segredos:"
            echo
            for s in $faltando; do echo "- \`$s\`"; done
            echo
            echo "Se um dia houver outra máquina, o roteiro é o README, em"
            echo "**Self deploy** — e a seção Deploy do \`CLAUDE.md\` diz o que"
            echo "mais ficou inerte junto (o rodapé com o commit, entre outros)."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Nada a publicar. Faltam:$faltando"

      # Os segredos vão por `env`, e não interpolados na linha de comando.
      # Interpolado, o valor vira argumento de processo — visível num `ps` de
      # quem estiver na máquina — e um caractere especial na chave quebraria
      # o shell de um jeito difícil de entender.
      - name: Abrir o SSH
        if: steps.configurado.outputs.pronto == 'true'
        env:
          CHAVE: ${{ secrets.VPS_SSH_KEY }}
          CHAVE_DO_HOST: ${{ secrets.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$CHAVE" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # A chave do HOST vem de um segredo, e não de
          # StrictHostKeyChecking=no. Desligar a checagem faz a Action
          # entregar a chave privada para qualquer servidor que atenda
          # naquele IP — que é exatamente o que um sequestro de DNS precisa.
          printf '%s\n' "$CHAVE_DO_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Publicar
        if: steps.configurado.outputs.pronto == 'true'
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USUARIO: ${{ secrets.VPS_USER }}
          PORTA: ${{ vars.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy \
              -p "$PORTA" \
              -o IdentitiesOnly=yes \
              "$USUARIO@$HOST" \
              'bash -lc "/var/www/full-hub/scripts/deploy.sh"'

      - name: Está no ar?
        if: steps.configurado.outputs.pronto == 'true'
        env:
          ALVO: ${{ vars.URL_DE_PRODUCAO }}
        run: |
          # Um deploy que termina sem erro e deixa o site fora do ar é o
          # pior resultado possível: ninguém vai olhar. Dez tentativas com
          # 3 s entre elas cobrem o tempo de o PM2 subir de novo.
          if [ -z "$ALVO" ]; then
            echo "Sem URL_DE_PRODUCAO configurada — pulando a conferência."
            exit 0
          fi
          for tentativa in $(seq 1 10); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$ALVO/login" || echo 000)
            echo "tentativa $tentativa: HTTP $codigo"
            # 200 na tela de login. 000 é "nem respondeu".
            if [ "$codigo" = "200" ]; then
              echo "No ar."
              exit 0
            fi
            sleep 3
          done
          echo "O painel não respondeu 200 depois do deploy."
          echo "Para voltar: ssh na VPS e rode scripts/deploy.sh --reverter"
          exit 1

  # ==========================================================================
  # O caminho que vale HOJE: a hospedagem da Hostinger, pelo Git do hPanel.
  #
  # O job de cima é a VPS que saiu. Este é o lugar onde o Full Hub roda de
  # verdade — uma hospedagem com Git, que clona a branch e constrói lá dentro.
  #
  # POR QUE PASSAR PELA ACTION, se o hPanel já sabe puxar sozinho
  #
  #   O auto-deploy do hPanel dispara no push, e no push de QUALQUER coisa:
  #   um commit que não compila publica igual, e o painel cai até alguém
  #   perceber. Chamando o webhook daqui, com `needs: verificar`, só publica
  #   o que passou por padrões, tipos, as oito varreduras, o build e os
  #   cenários da bateria. É a mesma ordem que o deploy da VPS tinha, e pela
  #   mesma razão: o `npm ci` do servidor reescreve o node_modules do
  #   processo que está NO AR.
  #
  # COMO LIGAR (duas coisas, uma vez)
  #
  #   1. no hPanel, em Avançado → GIT, ligue a implantação automática e copie
  #      a URL de webhook que ele mostra;
  #   2. no GitHub, em Settings → Secrets and variables → Actions → New
  #      repository secret, crie `HOSTINGER_DEPLOY_WEBHOOK` com essa URL.
  #
  #   Não registre a URL em Settings → Webhooks do GitHub: ali ela dispara no
  #   push cru, que é exatamente o que este job existe para não fazer.
  # ==========================================================================
  publicar-hostinger:
    name: Publicar na Hostinger
    needs: verificar
    runs-on: ubuntu-latest
    environment: producao

    steps:
      # Mesma decisão do job da VPS: falta de configuração não é falha. Um X
      # vermelho que significa "você não configurou isso" ensina todo mundo a
      # ignorar X vermelho, e aí o erro de verdade passa batido depois.
      - name: O webhook do hPanel existe?
        id: configurado
        env:
          WEBHOOK: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            echo "pronto=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "pronto=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Auto-deploy da Hostinger não configurado"
            echo
            echo "As verificações passaram, e ninguém foi avisado: falta o"
            echo "segredo \`HOSTINGER_DEPLOY_WEBHOOK\`."
            echo
            echo "Enquanto ele não existir, o site só muda quando alguém abre"
            echo "o hPanel e clica em **Deploy** — e quem responde se o que"
            echo "está no ar é este commit é o **rodapé do painel**, não esta"
            echo "Action."
            echo
            echo "Como ligar: o comentário do job \`publicar-hostinger\` em"
            echo "\`.github/workflows/deploy.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Nada a publicar: falta HOSTINGER_DEPLOY_WEBHOOK."

      # A URL vai por `env` e não interpolada na linha de comando, pela mesma
      # razão da chave de SSH acima: argumento de processo aparece num `ps`, e
      # esta URL é a credencial inteira — quem a tiver dispara deploy.
      - name: Chamar o deploy
        if: steps.configurado.outputs.pronto == 'true'
        env:
          WEBHOOK: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
        run: |
          codigo=$(curl -sS -X POST -o /tmp/resposta -w '%{http_code}' \
                        --max-time 60 "$WEBHOOK" || echo 000)
          echo "O hPanel respondeu HTTP $codigo"
          head -c 2000 /tmp/resposta || true
          echo

          case "$codigo" in
            2*) echo "Deploy disparado." ;;
            000) echo "::error::O hPanel não respondeu. A URL do webhook mudou?"; exit 1 ;;
            *)   echo "::error::O hPanel recusou o deploy (HTTP $codigo)."; exit 1 ;;
          esac

      # ATENÇÃO AO QUE ESTE PASSO NÃO PROVA.
      #
      # Ele confere que o site responde — não que o site responde COM ESTE
      # COMMIT. Foi exatamente assim que a interface nova ficou um dia inteira
      # fora do ar sem ninguém notar: o `/login` respondia 200 o tempo todo,
      # servindo um build de véspera.
      #
      # Quem responde a pergunta certa é o rodapé do painel, que diz de qual
      # commit o build saiu — e ele exige login, então nenhuma Action alcança.
      # Enquanto for assim, o veredito final é humano: abrir o /painel e ler
      # o rodapé. O que este passo pega é o caso em que o deploy derrubou o
      # site, que é pior e é silencioso.
      - name: O site continua de pé?
        if: steps.configurado.outputs.pronto == 'true'
        env:
          ALVO: ${{ vars.URL_DE_PRODUCAO }}
        run: |
          if [ -z "$ALVO" ]; then
            echo "Sem a variável URL_DE_PRODUCAO — pulando a conferência."
            echo "Settings → Secrets and variables → Actions → Variables."
            exit 0
          fi

          # Vinte tentativas com 6 s: o build numa hospedagem compartilhada é
          # bem mais lento que os 23 s do build daqui, e durante ele o site
          # pode responder 502.
          for tentativa in $(seq 1 20); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$ALVO/login" || echo 000)
            echo "tentativa $tentativa: HTTP $codigo"
            [ "$codigo" = "200" ] && { echo "De pé."; exit 0; }
            sleep 6
          done

          echo "::error::O /login não respondeu 200 depois do deploy."
          exit 1
