{t:'p',c:'O briefing deve orientar o trabalho, mas não precisa limitar a contribuição do designer. Se durante o desenvolvimento você perceber que existe uma maneira melhor de organizar uma informação, utilizar uma imagem ou construir uma composição, vale explorar essa possibilidade.'},
{t:'citacao',c:'O papel da Criação não é transportar um texto para dentro de uma arte. É transformar informação em comunicação visual.'},
{t:'h3',c:'Qualidade também está nas pequenas demandas'},
{t:'p',c:'Nem todo trabalho será uma grande campanha, um key visual ou um projeto de branding. Grande parte da rotina pode ser formada por posts, adaptações, datas comemorativas, comunicados e conteúdos recorrentes.'},
{t:'p',c:'Ainda assim, essas peças também constroem a percepção sobre o trabalho da agência e sobre a marca do cliente. Uma demanda ser simples não significa que ela precisa parecer descuidada.'},
{t:'h3',c:'Evite a repetição sem motivo'},
{t:'p',c:'O problema acontece quando a repetição deixa de ser consistência e passa a ser falta de exploração. Templates devem ajudar a equipe a ganhar velocidade, mas não podem impedir novas soluções. Sempre que perceber que uma comunicação está ficando repetitiva, procure explorar:'},
{t:'lista',c:['Novos enquadramentos','Diferentes usos da fotografia','Novas proporções','Outras composições','Variações dentro da própria identidade','Novas maneiras de trabalhar os elementos gráficos da marca']},
{t:'h3',c:'Conheça o cliente para criar melhor'},
{t:'p',c:'Observe os trabalhos anteriores, acompanhe as peças aprovadas e procure entender quais decisões visuais fazem parte daquele universo. Também converse com outros designers — alguém que trabalha há bastante tempo com determinada conta provavelmente acumulou conhecimentos que não aparecem em nenhum brandbook.'},
{t:'h3',c:'Use referências para ampliar, não para limitar'},
{t:'p',c:'Nem toda peça precisa de um grande moodboard, mas manter contato com bons projetos, campanhas, fotografias e soluções de design ajuda a evitar que o repertório fique restrito apenas ao que a própria agência já produz.'},
{t:'p',c:'Olhar somente para os trabalhos anteriores daquele cliente pode fazer com que a comunicação se torne um ciclo de repetição.'},
{t:'h3',c:'Olhe para o perfil como um todo'},
{t:'p',c:'Uma peça pode funcionar isoladamente e ainda assim não contribuir para uma comunicação interessante ao longo do tempo. Observe se todas as peças estão utilizando as mesmas soluções, se existe variedade suficiente e se o conjunto continua transmitindo a identidade desejada. Isso é especialmente importante quando vários designers trabalham para o mesmo cliente.'},
{t:'h3',c:'Não tenha medo de propor'},
{t:'p',c:'A equipe deve se sentir confortável para apresentar novas possibilidades quando acreditar que elas podem melhorar o trabalho. Nem toda proposta será aprovada e nem toda peça precisa trazer uma grande inovação, mas a vontade de melhorar o que está sendo produzido deve fazer parte da rotina.'},
{t:'h3',c:'Peça opinião'},
{t:'p',c:'Ficar muito tempo trabalhando em uma mesma peça pode fazer com que alguns problemas deixem de ser percebidos. Quando estiver em dúvida, peça a opinião de outro designer. Essa troca não deve ser entendida como insegurança ou falta de autonomia.'},
{t:'h3',c:'Revise com olhar crítico'},
{t:'p',c:'Antes de considerar uma peça finalizada, procure observá-la como se estivesse vendo pela primeira vez. Não revise apenas procurando erros. Pergunte-se:'},
{t:'citacao',c:'Está bom ou apenas está pronto?'},
{t:'p',c:'Existe uma diferença importante entre os dois. Ao mesmo tempo, é importante desenvolver senso crítico para entender quando a peça já resolveu aquilo que precisava resolver. Buscar qualidade não significa trabalhar indefinidamente em cada demanda.'},
{t:'h3',c:'Use o tempo de maneira inteligente'},
{t:'p',c:'O nível de exploração precisa ser proporcional à importância e à complexidade da demanda. Uma grande campanha naturalmente exige mais pesquisa e desenvolvimento do que uma adaptação simples. Isso não significa tratar trabalhos menores com menos cuidado, mas saber direcionar energia para aquilo que realmente pode melhorar o resultado.'},
{t:'h3',c:'O seu trabalho também constrói repertório'},
{t:'p',c:'Cada peça desenvolvida pode ensinar alguma coisa. Uma solução tipográfica que funcionou bem, um tratamento de imagem interessante ou um feedback recebido podem servir como aprendizado para trabalhos futuros.'},
{t:'destaque',c:'Uma área de Criação saudável não deve possuir apenas bons designers individualmente. Ela deve desenvolver um <b>repertório coletivo</b>, no qual as experiências de uma pessoa contribuem para melhorar o trabalho de todas as outras.'},
{t:'principio',c:['O volume de trabalho nunca deve fazer a equipe esquecer que existe criação mesmo nas demandas mais simples.','Nem todo post precisa ser revolucionário. Mas todo post pode ser bem pensado, bem executado e feito com intenção.','O objetivo não é transformar cada peça em um projeto complexo, e sim evitar que a rotina transforme o trabalho criativo em produção automática.']}
]});

LIVRO.push({id:'performance',t:'Criação para criativos de performance',r:'Como equilibrar design e resultado quando a peça existe para gerar uma ação.',b:[
{t:'p',c:'Criativos de performance possuem uma função bastante objetiva: gerar uma ação — um clique, cadastro, compra, inscrição, contato, download ou qualquer outro objetivo definido pela campanha.'},
{t:'p',c:'Por isso, diferente de algumas peças institucionais, o sucesso de um criativo de performance não pode ser avaliado apenas pela qualidade estética. A peça precisa ser visualmente bem resolvida, mas também precisa funcionar.'},
{t:'h3',c:'Performance não significa fazer uma peça ruim'},
{t:'p',c:'Existe uma ideia equivocada de que peças de performance precisam ser visualmente agressivas, extremamente carregadas ou distantes da identidade da marca para gerar resultado. Nem sempre é assim. Um bom criativo pode ser claro, direto, visualmente interessante, coerente com a identidade, fácil de compreender — e ainda assim performar muito bem.'},
{t:'citacao',c:'O desafio não é escolher entre design e resultado. É utilizar o design para potencializar o resultado.'},
{t:'h3',c:'Entenda o que estamos tentando vender'},
{t:'p',c:'Não basta saber que a campanha vende um produto ou serviço. Procure compreender qual é o principal benefício, qual problema ele resolve, por que alguém deveria se interessar, qual é o diferencial, qual é a oferta e qual percepção queremos gerar.'},
{t:'p',c:'Um briefing pode trazer um título e uma CTA. O designer deve tentar compreender a lógica por trás deles.'},
{t:'h3',c:'Clareza é uma ferramenta criativa'},
{t:'p',c:'Em performance, a mensagem precisa ser compreendida rapidamente. Isso não significa que todas as peças devam ser simples ou minimalistas — significa que a criatividade não pode dificultar o entendimento. O usuário ainda precisa entender:'},
{t:'lista',c:['O que é isso?','Por que isso pode me interessar?','O que eu devo fazer agora?']},
{t:'p',c:'Se a ideia visual prejudicar essas respostas, provavelmente ela precisa ser revista.'},
{t:'h3',c:'Não existe um único criativo perfeito'},
{t:'p',c:'Muitas vezes não estamos tentando descobrir uma única solução definitiva, e sim diferentes caminhos para entender o que funciona melhor. Não encare as variações apenas como versões obrigatórias da mesma peça — elas são oportunidades de testar hipóteses diferentes. Uma campanha pode explorar:'},
{t:'lista',c:['Produto','Benefício','Oferta','Dor','Desejo','Prova social','Urgência','Diferencial','Lifestyle','Demonstração','Comparação','Conteúdo mais racional ou mais emocional']},
{t:'h3',c:'Variar não é apenas trocar a cor'},
{t:'p',c:'Criar variações deve significar testar alguma coisa. Mudar apenas uma fotografia, uma cor ou a posição de um elemento pode ser válido quando existe uma intenção por trás da mudança. Mas, sempre que possível, pense também em variações conceituais.'},
{t:'p',c:'Quanto mais claras forem as diferenças entre os criativos, mais fácil será entender posteriormente o que gerou um resultado diferente.'},
{t:'h3',c:'Dados também fazem parte do processo criativo'},
{t:'p',c:'Saber que determinada abordagem, fotografia, linguagem ou estrutura teve um resultado melhor pode ajudar a construir peças mais eficientes no futuro. Esses dados não devem ficar restritos à equipe de mídia ou performance.'},
{t:'citacao',c:'O criativo não termina quando o arquivo é entregue.'},
{t:'h3',c:'Mas cuidado com conclusões rápidas'},
{t:'p',c:'Uma peça ter performado melhor não significa automaticamente que determinada cor, fotografia ou composição seja a única responsável pelo resultado. Existem diversas variáveis envolvidas em uma campanha.'},
{t:'p',c:'Os aprendizados de performance devem ser utilizados como orientação, e não como regras absolutas. Evite transformar um resultado positivo em uma fórmula que será repetida indefinidamente — o que funcionou ontem pode deixar de funcionar quando o público se acostumar com aquela linguagem.'},
{t:'h3',c:'Não mate a marca em busca de resultado'},
{t:'p',c:'Performance trabalha muito com curto prazo. Marca é construída no longo prazo. Esses dois objetivos precisam conversar.'},
{t:'p',c:'Toda peça patrocinada continua sendo comunicação da marca. Uma pessoa que conhece a empresa através de um anúncio também está formando uma percepção sobre ela naquele momento.'},
{t:'h3',c:'O anúncio concorre por atenção'},
{t:'p',c:'Nas redes sociais, um anúncio não aparece sozinho. Ele disputa atenção com vídeos, memes, notícias, amigos, influenciadores, outras marcas e dezenas de estímulos diferentes. Por isso, a primeira pergunta não deve ser apenas “essa peça está bonita?”, mas também:'},
{t:'citacao',c:'Existe alguma coisa aqui que faria alguém parar para olhar?'},
{t:'h3',c:'Nem sempre parecer publicidade é a melhor solução'},
{t:'p',c:'Dependendo da estratégia, algumas peças podem funcionar melhor quando se aproximam da linguagem natural da plataforma. Em outros casos, uma estética claramente publicitária pode ser exatamente o que a campanha precisa. Não existe uma resposta única.'},
{t:'h3',c:'Aprenda com os criativos vencedores'},
{t:'p',c:'Quando uma peça apresentar bons resultados, observe a ideia utilizada, o benefício apresentado, a imagem, o nível de simplicidade, a linguagem, a oferta, o formato e a forma como o produto aparece. Mas isso não significa duplicar o criativo vencedor até ele deixar de funcionar.'},
{t:'h3',c:'Aprenda também com o que não funcionou'},
{t:'p',c:'Criativos com baixo desempenho também oferecem informação. Talvez a mensagem estivesse pouco clara, o conceito não tenha gerado atenção, a oferta não estivesse evidente — ou talvez o problema sequer estivesse no criativo.'},
{t:'h3',c:'Volume não pode significar descuido'},
{t:'p',c:'Campanhas de performance podem exigir muitas peças, formatos e variações em pouco tempo. Mas agilidade não significa abandonar critérios básicos de qualidade. Erros de texto, informações incorretas, imagens ruins ou peças mal finalizadas também impactam resultado.'},
{t:'h3',c:'Criação e performance devem conversar'},
{t:'p',c:'A relação ideal não é uma equipe pedindo peças e outra simplesmente executando. A Criação pode contribuir propondo caminhos, a Performance trazendo dados, o Atendimento trazendo contexto sobre o cliente e a estratégia ajudando a definir hipóteses.'},
{t:'principio',c:['Um bom criativo de performance não é apenas aquele que parece bom dentro do arquivo de criação. É aquele que comunica, chama atenção, respeita a marca e ajuda a gerar resultado.','Performance não deve transformar o designer em um operador de variações. Pelo contrário: é uma oportunidade de utilizar criatividade, repertório e dados para descobrir maneiras cada vez mais eficientes de se comunicar.']}
]});

LIVRO.push({id:'audiovisual',t:'Criação para audiovisual',r:'Intenção, ritmo e clareza em vídeo, motion e conteúdos em movimento.',b:[
{t:'p',c:'Vídeos, animações, motion graphics, reels, stories e demais formatos em movimento devem ser tratados com o mesmo cuidado estratégico e visual aplicado às peças estáticas.'},
{t:'p',c:'A velocidade do formato não deve resultar em decisões apressadas. Um bom material audiovisual precisa ter intenção, clareza, ritmo e coerência com a identidade do cliente.'},
{t:'h3',c:'Entendimento da proposta'},
{t:'p',c:'Antes de iniciar, compreenda qual é a função do material dentro da comunicação. Um vídeo pode ter objetivos muito diferentes: apresentar um produto, divulgar uma campanha, explicar uma informação, gerar reconhecimento, criar desejo, registrar um evento, gerar interação, direcionar para uma ação ou fortalecer o posicionamento da marca.'},
{t:'destaque',c:'Nem todo vídeo precisa de grandes efeitos, muitas transições ou uma edição complexa. Em muitos casos, uma ideia simples e bem executada possui mais força do que uma produção excessivamente carregada.'},
{t:'h3',c:'Pense além da estética'},
{t:'p',c:'Um vídeo visualmente bonito não necessariamente é um bom vídeo. A qualidade audiovisual também está relacionada à capacidade de manter interesse, transmitir a mensagem e fazer com que o conteúdo seja compreendido.'},
{t:'p',c:'Avalie não apenas a estética dos frames individualmente, mas como eles funcionam em sequência. Imagem, texto, movimento, ritmo, áudio e tempo de exposição precisam trabalhar juntos.'},
{t:'h3',c:'Movimento deve ter intenção'},
{t:'p',c:'Evite movimentar elementos apenas porque o formato permite. Um movimento pode ser utilizado para direcionar a atenção, destacar uma informação, criar continuidade, reforçar uma mudança, apresentar um produto, construir uma narrativa ou gerar ritmo.'},
{t:'citacao',c:'Quando todos os elementos se movimentam ao mesmo tempo, a animação perde hierarquia.'},
{t:'h3',c:'Respeite o tempo de quem assiste'},
{t:'p',c:'Evite introduções excessivamente demoradas ou cenas que permanecem por muito tempo sem acrescentar informação. Ao mesmo tempo, não acelere o conteúdo a ponto de prejudicar a leitura e a compreensão.'},
{t:'p',c:'O ritmo deve acompanhar a proposta. Uma campanha institucional pode exigir uma construção mais contemplativa, enquanto um anúncio de performance pode precisar de uma entrada muito mais direta.'},
{t:'h3',c:'Nem tudo precisa aparecer'},
{t:'p',c:'O vídeo não precisa apresentar todas as informações disponíveis no briefing. Quando houver muito conteúdo, identifique aquilo que realmente precisa aparecer e o que pode ser direcionado para outras etapas da comunicação.'},
{t:'p',c:'A seleção também faz parte do trabalho criativo. Em muitos casos, comunicar menos informações com maior clareza gera um resultado melhor.'},
{t:'h3',c:'A identidade precisa continuar presente'},
{t:'p',c:'Tipografia, cores, fotografia, grafismos, linguagem, ritmo e tratamento de imagem devem continuar coerentes com o universo visual do cliente. Ao mesmo tempo, o audiovisual pode revelar novas possibilidades: elementos estáticos em outros formatos podem ganhar comportamento, ritmo e interação.'},
{t:'h3',c:'Áudio também é parte da criação'},
{t:'p',c:'Trilha, locução ou efeitos sonoros devem ser tratados como parte da experiência e não apenas como complemento. A trilha deve estar alinhada ao posicionamento da marca, ao ritmo do material, ao público, ao objetivo da comunicação e à sensação que se deseja transmitir.'},
{t:'destaque',c:'Quando o conteúdo depender de áudio para ser compreendido, considere que parte do público poderá assisti-lo sem som. A informação principal deve permanecer acessível visualmente.'},
{t:'h3',c:'Trabalhe pensando no formato final'},
{t:'p',c:'Considere desde o início onde o material será publicado e como será consumido. Uma composição horizontal nem sempre se adapta de maneira eficiente para um formato vertical. Quando houver diferentes formatos, procure preservar a ideia central da peça em vez de simplesmente recortar ou redimensionar.'},
{t:'h3',c:'Atenção aos materiais recebidos'},
{t:'p',c:'Nem sempre a Criação terá controle sobre a qualidade dos vídeos, fotografias ou outros arquivos recebidos. Arquivos com baixa resolução, gravações instáveis, enquadramentos inadequados ou problemas de áudio podem exigir adaptações criativas.'},
{t:'p',c:'Quando uma limitação comprometer diretamente a qualidade da entrega, ela deve ser sinalizada. O objetivo não é esconder um problema técnico a qualquer custo, mas encontrar a melhor solução possível dentro das condições disponíveis.'},
{t:'h3',c:'Use ferramentas como apoio, não como solução'},
{t:'p',c:'Ferramentas de edição, bancos de vídeo, inteligência artificial, templates e recursos automatizados podem ampliar muito as possibilidades. Entretanto, o acesso a essas ferramentas não substitui direção de arte e pensamento criativo.'},
{t:'citacao',c:'Primeiro deve existir uma intenção. Depois, escolhe-se o recurso mais adequado para executá-la.'},
{t:'h3',c:'Revise assistindo como público'},
{t:'check',titulo:'Antes da entrega, assista ao conteúdo completo',c:['A mensagem está clara','A leitura acontece com naturalidade','Nenhuma informação passa rápido demais','Não existem momentos desnecessariamente longos','As transições fazem sentido','Os elementos possuem boa continuidade','O áudio está coerente','O resultado parece finalizado']},
{t:'p',c:'Quando possível, peça que outra pessoa da equipe assista ao material. Quem não participou da edição pode perceber problemas que já se tornaram invisíveis para quem passou muito tempo no projeto.'},
{t:'h3',c:'Troca de repertório'},
{t:'p',c:'Referências de publicidade, cinema, videoclipes, conteúdo digital, motion design e fotografia podem ajudar a ampliar as possibilidades da equipe. Uma técnica, referência ou solução encontrada por um profissional pode facilitar o trabalho de toda a equipe.'},
{t:'h3',c:'Não utilize efeitos apenas para impressionar'},
{t:'p',c:'Um recurso visual pode ser tecnicamente interessante e ainda assim não contribuir para a comunicação. A melhor edição não é necessariamente aquela em que o trabalho do editor fica mais evidente — muitas vezes, uma boa edição é justamente aquela em que tudo parece acontecer de maneira natural.'},
{t:'principio',c:['Materiais audiovisuais devem unir ideia, estética, ritmo e clareza. O movimento deve reforçar a mensagem, não competir com ela.','Um bom audiovisual não precisa ser complexo. Ele precisa ser bem pensado, coerente e intencional.']}
]});

LIVRO.push({id:'imagens',t:'Imagens, ilustrações e inteligência artificial',r:'Critério na escolha de imagem, uso de IA, licenciamento e responsabilidade sobre os direitos de uso.',b:[
{t:'p',c:'Imagens, ilustrações e recursos gerados por inteligência artificial fazem parte do repertório disponível para a área de Criação e podem ampliar significativamente as possibilidades visuais de um projeto. Esses recursos, porém, devem ser utilizados com critério.'},
{t:'h3',c:'Escolha imagem com intenção'},
{t:'p',c:'A imagem utilizada em uma peça não deve funcionar apenas como preenchimento. Ela precisa contribuir para a mensagem, reforçar uma sensação, representar o público, contextualizar um produto ou ajudar a construir o posicionamento da marca.'},
{t:'p',c:'Antes de utilizá-la, observe se ela conversa com o conceito, o cliente, o público, o tom da comunicação, a campanha e o contexto em que será aplicada.'},
{t:'h3',c:'Evite imagens genéricas'},
{t:'p',c:'Bancos de imagem são ferramentas úteis, mas seu uso excessivamente previsível pode fazer com que diferentes marcas comecem a parecer iguais. Procure imagens com personalidade, enquadramentos interessantes e situações menos artificiais.'},
{t:'citacao',c:'Isso não significa evitar bancos de imagem. Significa utilizá-los com curadoria.'},
{t:'h3',c:'Observe os detalhes'},
{t:'p',c:'Ao selecionar uma fotografia, não olhe apenas para o elemento principal. Cenário, roupas, objetos, expressões, arquitetura, produtos, iluminação e pequenos detalhes também fazem parte da comunicação. Essa análise é especialmente importante em imagens produzidas ou alteradas por inteligência artificial.'},
{t:'h3',c:'Representação deve fazer sentido'},
{t:'p',c:'Ao trabalhar com pessoas, considere quem aquela marca deseja representar. Idade, perfil, estilo, contexto, comportamento e diversidade precisam estar coerentes com o público e com a mensagem. Procure evitar personagens que pareçam escolhidos apenas porque estavam disponíveis no banco de imagem.'},
{t:'h3',c:'Fotografia deve respeitar o universo da marca'},
{t:'p',c:'Antes de buscar uma imagem, procure entender qual tipo de fotografia pertence àquela marca. Isso inclui observar iluminação, enquadramento, tratamento, cores, cenários, perfil dos personagens, nível de produção, espontaneidade e presença do produto.'},
{t:'h3',c:'Ilustração também precisa ter linguagem'},
{t:'p',c:'Ilustrações não devem ser escolhidas apenas porque combinam com determinada cor ou tema. Traço, proporção, textura, acabamento e nível de detalhamento também constroem linguagem. Misturar estilos muito diferentes sem uma intenção clara pode enfraquecer o sistema visual.'},
{t:'h3',c:'Inteligência artificial é uma ferramenta de criação'},
{t:'p',c:'Ferramentas de IA podem ajudar na geração de imagens, composição de cenas, exploração de conceitos, tratamento visual e criação de alternativas difíceis por outros meios. Elas devem ser entendidas como ferramentas de apoio à Criação.'},
{t:'citacao',c:'Gerar uma imagem não significa que ela esteja pronta para ser utilizada.'},
{t:'h3',c:'Não utilize a primeira geração como resultado final'},
{t:'p',c:'Imagens geradas por IA frequentemente exigem ajustes. Pode ser necessário corrigir anatomia, objetos, perspectiva, iluminação, texturas, proporções, produtos, logotipos, cenários e detalhes inconsistentes.'},
{t:'destaque',c:'Se um problema seria considerado inadequado em uma fotografia tradicional ou em um trabalho de manipulação, também deve ser considerado inadequado em uma imagem gerada por IA.'},
{t:'h3',c:'IA não substitui direção de arte'},
{t:'p',c:'Ferramentas generativas respondem ao direcionamento que recebem. Quanto mais clara for a intenção visual, maiores as chances de chegar a um bom resultado. O designer deve continuar tomando decisões sobre conceito, composição, iluminação, paleta, enquadramento, linguagem, atmosfera e relação com a identidade.'},
{t:'p',c:'A tecnologia deve executar uma intenção criativa, e não substituir essa intenção.'},
{t:'h3',c:'Mantenha consistência entre imagens'},
{t:'p',c:'Uma campanha pode combinar fotografias próprias, banco de imagens, renders e conteúdos gerados por IA. Quando isso acontecer, procure aproximar esses materiais visualmente — tratamento de cor, contraste, luz, enquadramento e acabamento ajudam a criar uma linguagem mais consistente.'},
{t:'citacao',c:'O público não precisa identificar como cada imagem foi produzida. Precisa perceber que todas pertencem ao mesmo universo.'},
{t:'h3',c:'Cuidado com produtos e elementos de marca'},
{t:'p',c:'Quando uma imagem apresentar produtos, embalagens, logos ou outros elementos específicos de um cliente, a atenção deve ser redobrada. Ferramentas generativas podem alterar tipografia, formatos, rótulos, cores, proporções, informações e características do produto.'},
{t:'p',c:'Sempre que o produto real estiver disponível, ele deve ser utilizado como referência e conferido com atenção.'},
{t:'h3',c:'Direitos de uso e licenciamento'},
{t:'p',c:'Todo material utilizado em uma peça deve possuir autorização ou licença compatível com o contexto em que será publicado. Isso se aplica a fotografias, ilustrações, vídeos, músicas e efeitos sonoros, elementos gráficos, templates, bancos de imagem e arquivos produzidos por terceiros.'},
{t:'destaque',c:'Uma imagem encontrada no Pinterest, Google, Behance ou Instagram pode ser utilizada como <b>referência visual</b>, mas isso não significa que esteja autorizada para utilização comercial. Referência e material de produção não são a mesma coisa.'},
{t:'h3',c:'Uso do Envato'},
{t:'p',c:'Sempre que um material do Envato for utilizado em um trabalho para cliente, é importante realizar corretamente o <b>registro/licenciamento do item para o respectivo projeto ou cliente</b>, garantindo que exista um histórico da licença associado àquela utilização.'},
{t:'h3',c:'Criação de novos clientes e projetos no Envato'},
{t:'p',c:'Nenhum Diretor de Arte possui autorização para cadastrar livremente novos clientes ou projetos no Envato em nome de empresas que não façam parte oficialmente da carteira da agência. Os registros devem estar vinculados exclusivamente a clientes oficiais, identificados como pessoa jurídica/CNPJ.'},
{t:'p',c:'Não devem ser criados registros para:'},
{t:'lista',c:['Projetos pessoais','Freelances particulares','Amigos ou familiares','Empresas que não sejam clientes da agência','Trabalhos externos','Projetos sem vínculo comercial oficial com a agência']},
{t:'p',c:'A assinatura, os acessos e as licenças disponibilizadas pela agência são recursos profissionais destinados exclusivamente às atividades desenvolvidas dentro da operação da empresa. Em caso de dúvida, consulte a liderança antes de realizar qualquer inclusão.'},
{t:'h3',c:'Responsabilidade de quem utiliza o material'},
{t:'p',c:'O fato de um arquivo estar disponível para download não elimina a responsabilidade sobre sua utilização. Sempre que houver dúvida sobre licença, origem ou possibilidade de uso, a orientação é confirmar antes de publicar ou enviar para produção.'},
{t:'p',c:'O cuidado com direitos de uso protege não apenas o cliente, mas também o profissional e a própria agência.'},
{t:'h3',c:'Não dependa de uma única ferramenta'},
{t:'p',c:'Bancos de imagem, fotografia, ilustração, 3D, manipulação e inteligência artificial podem ser utilizados de maneira complementar. Em alguns casos, uma fotografia real será a melhor escolha. Em outros, uma ilustração ou uma imagem gerada pode abrir possibilidades muito mais interessantes.'},
{t:'h3',c:'Revise imagens com atenção redobrada'},
{t:'p',c:'Quanto mais complexa for a manipulação ou geração de uma imagem, maior deve ser o cuidado na revisão. Observe a peça em diferentes escalas e procure detalhes que possam denunciar erros. Não confie apenas na primeira impressão.'},
{t:'principio',c:['O valor não está na ferramenta utilizada, mas na qualidade da decisão visual.','Uma boa imagem precisa parecer parte da marca, contribuir para a mensagem e estar tecnicamente bem resolvida.','A tecnologia pode ampliar as possibilidades da Criação, mas o senso crítico continua sendo indispensável.']}
]});

LIVRO.push({id:'qualidade',t:'Controle de qualidade',r:'Por que revisar vai muito além de procurar erro de português, e como calibrar o nível de revisão ao risco.',b:[
{t:'p',c:'A revisão faz parte do processo criativo e deve ser tratada como uma etapa essencial da entrega. Uma peça pode estar visualmente bem resolvida e ainda assim apresentar erros de texto, informações incorretas, problemas de aplicação de marca ou pequenos detalhes que comprometem a percepção de qualidade.'},
{t:'citacao',c:'Revisar não significa apenas procurar erros de português.'},
{t:'h3',c:'Responsabilidade sobre a própria entrega'},
{t:'p',c:'Cada profissional é responsável por realizar uma primeira revisão completa do próprio trabalho antes de encaminhá-lo para aprovação interna, atendimento ou cliente. É importante desenvolver o hábito de se perguntar:'},
{t:'lista',c:['A informação está correta?','A peça realmente responde ao briefing?','Existe algum detalhe visual que pode ser melhorado?','A aplicação da marca está correta?','O resultado parece finalizado?','Eu me sentiria confortável vendo essa peça publicada?']},
{t:'h3',c:'Revisar é olhar além da estética'},
{t:'p',c:'Além da composição visual, devem ser observados: ortografia e gramática, datas, horários, endereços, telefones, URLs, valores, nomes próprios, logos, patrocinadores, informações legais, CTAs, dimensões e formatos, qualidade de imagens e coerência com a identidade visual.'},
{t:'destaque',c:'Quanto mais sensível for a informação, maior deve ser a atenção. Uma data errada, um preço incorreto ou um nome de produto trocado pode causar um problema muito maior do que um pequeno desalinhamento visual.'},
{t:'h3',c:'Não confie apenas na memória'},
{t:'p',c:'Mesmo quando o profissional conhece bem uma conta, as informações devem ser conferidas no briefing ou nos materiais oficiais disponíveis. O fato de determinado dado ter sido utilizado em uma campanha anterior não significa que ele permaneça válido.'},
{t:'h3',c:'Faça uma segunda leitura'},
{t:'p',c:'Depois de finalizar uma peça, crie uma pequena distância antes da revisão sempre que o prazo permitir. Voltar para o arquivo alguns minutos depois, visualizar a peça em outro tamanho ou abrir o material exportado pode ajudar a perceber problemas que estavam passando despercebidos.'},
{t:'p',c:'Também é útil revisar o conteúdo em uma ordem diferente daquela utilizada durante a criação. Quando o cérebro já conhece aquilo que deveria estar escrito, ele tende a completar informações automaticamente.'},
{t:'h3',c:'A troca entre a equipe melhora a qualidade'},
{t:'p',c:'Em demandas mais importantes, complexas ou com grande exposição, a revisão de uma segunda pessoa pode ser extremamente valiosa. Essa troca não deve ser vista como falta de autonomia — ela funciona como uma camada adicional de segurança.'},
{t:'h3',c:'O nível de revisão deve acompanhar o risco'},
{t:'p',c:'Nem todas as peças possuem o mesmo impacto. Quanto maior a exposição, o investimento, a quantidade produzida, a dificuldade de correção e a importância da informação, maior deve ser o nível de atenção dedicado à revisão.'},
{t:'h3',c:'Cuidado com adaptações'},
{t:'p',c:'Adaptações são uma fonte frequente de erros porque muitas vezes são percebidas como demandas simples. Ao transformar uma peça para outro formato, é comum que elementos sejam reposicionados, textos reduzidos ou informações reorganizadas — e é justamente nesse momento que surgem problemas de leitura, cortes e diferenças entre versões.'},
{t:'citacao',c:'Uma adaptação também precisa ser revisada como uma peça nova.'},
{t:'h3',c:'Cuidado com arquivos utilizados como base'},
{t:'p',c:'Reaproveitar arquivos anteriores pode agilizar a produção, mas também pode carregar informações antigas para uma nova demanda. Datas, preços, logos, rodapés, chamadas e textos ocultos podem permanecer no arquivo sem que o profissional perceba.'},
{t:'p',c:'O fato de algo já ter sido aprovado anteriormente não significa que continue correto para a nova peça.'},
{t:'h3',c:'Não normalize pequenos erros'},
{t:'p',c:'Quando a equipe trabalha com alto volume, existe o risco de pequenos problemas começarem a ser tratados como aceitáveis. Um alinhamento mal resolvido, uma imagem de baixa qualidade ou uma aplicação incorreta de marca podem parecer pequenos isoladamente, mas a repetição desses problemas diminui gradualmente a qualidade percebida do trabalho.'},
{t:'citacao',c:'Qualidade é construída pela soma dos detalhes.'},
{t:'h3',c:'Feedback também é ferramenta de qualidade'},
{t:'p',c:'Quando um mesmo tipo de correção aparece com frequência, vale entender se existe algum padrão por trás dela. Talvez uma informação esteja sendo interpretada de maneira incorreta, uma regra da marca não esteja clara ou um detalhe esteja escapando repetidamente durante as revisões.'},
{t:'h3',c:'Revisar não significa buscar perfeição infinita'},
{t:'p',c:'Existe um momento em que a peça já cumpre bem seu objetivo e está pronta para seguir. O senso crítico também envolve saber identificar quando um ajuste realmente melhora o trabalho e quando ele representa apenas uma preferência pessoal.'},
{t:'principio',c:['Uma boa revisão protege a Criação, o Atendimento, a agência e o cliente.','O ideal é que erros sejam encontrados antes que a peça saia da área de Criação.','Qualidade não é apenas fazer uma boa ideia. É garantir que essa ideia chegue ao público de forma correta, consistente e bem executada.']}
]});

LIVRO.push({id:'aprovacao',t:'Apresentação e aprovação',r:'Como apresentar uma solução, entender um feedback e saber quando defender e quando ceder.',b:[
{t:'nota',c:'No documento original este capítulo aparece repetindo o título “Controle de Qualidade”. O conteúdo é sobre <b>apresentação e aprovação</b> — vale corrigir o título na próxima atualização.'},
{t:'p',c:'A aprovação é uma etapa natural do trabalho de Criação e deve ser entendida como parte do desenvolvimento da peça, e não apenas como o momento em que o trabalho é enviado para receber um “sim” ou “não”.'},
{t:'h3',c:'Entregue um trabalho que você considera pronto'},
{t:'p',c:'Uma peça não deve ser encaminhada para aprovação apenas para descobrir se “está no caminho certo”, salvo quando o projeto exigir deliberadamente uma apresentação de caminhos ou estudos preliminares.'},
{t:'destaque',c:'Antes de encaminhar, o designer deve ter feito sua própria revisão e estar confortável em defender as decisões tomadas. A aprovação não deve substituir o senso crítico da Criação.'},
{t:'h3',c:'Apresente soluções, não apenas arquivos'},
{t:'p',c:'Em projetos que envolvam conceitos, campanhas, identidades ou key visuals, o contexto pode ser tão importante quanto a própria peça. Nem sempre quem recebe o material participou de todo o raciocínio. Quando necessário, a Criação deve ajudar a explicar:'},
{t:'lista',c:['Qual foi o conceito utilizado','Qual problema a solução procura resolver','Por que determinada direção foi escolhida','Como a proposta se relaciona com a marca','Como ela pode se desdobrar em outros formatos']},
{t:'h3',c:'Evite apresentar opções sem necessidade'},
{t:'p',c:'Mais opções não significam necessariamente uma aprovação melhor. Criar muitas alternativas apenas para oferecer escolha pode aumentar o tempo de produção e transformar decisões estratégicas em uma comparação baseada apenas em gosto pessoal.'},
{t:'p',c:'Quando houver mais de uma proposta, é importante que existam diferenças reais entre os caminhos. Três versões praticamente iguais dificilmente ajudam na tomada de decisão.'},
{t:'h3',c:'Saiba explicar suas decisões'},
{t:'p',c:'O designer não precisa transformar toda aprovação em uma defesa longa do projeto, mas deve ser capaz de explicar as principais escolhas quando necessário — hierarquia, público, identidade, legibilidade, conceito, formato, aplicação e objetivo da comunicação.'},
{t:'p',c:'Ao mesmo tempo, nem toda decisão precisa ser defendida até o fim. Em alguns casos, um feedback pode revelar um problema real ou uma informação que a Criação ainda não possuía.'},
{t:'h3',c:'Não transforme aprovação em disputa'},
{t:'p',c:'O cliente conhece seu negócio. O Atendimento possui contexto sobre a relação com a conta. A Criação possui conhecimento visual e técnico. O melhor resultado normalmente acontece quando essas perspectivas conseguem conversar.'},
{t:'h3',c:'Entenda o motivo antes de alterar'},
{t:'p',c:'Comentários como “não gostei”, “está estranho”, “quero mais moderno” ou “precisa chamar mais atenção” podem possuir interpretações muito diferentes. Antes de alterar toda a peça tentando adivinhar uma solução, vale buscar mais contexto.'},
{t:'citacao',c:'Entender corretamente o problema reduz consideravelmente a quantidade de alterações necessárias.'},
{t:'h3',c:'Feedback consolidado melhora o processo'},
{t:'p',c:'Receber pequenos feedbacks separados ao longo do dia pode fazer com que a mesma peça seja aberta, alterada e exportada diversas vezes sem necessidade. Além de consumir tempo, isso aumenta a possibilidade de versões conflitantes.'},
{t:'p',c:'Quando houver diferentes pessoas participando da aprovação, é importante que exista alinhamento entre elas antes que as alterações sejam encaminhadas para a produção.'},
{t:'h3',c:'Diferencie preferência de problema'},
{t:'p',c:'Um texto ilegível, uma informação incorreta ou uma aplicação errada de marca são problemas que precisam ser corrigidos. Já determinadas escolhas de composição, cor, imagem ou estilo podem envolver interpretação.'},
{t:'p',c:'Quando uma preferência não comprometer o trabalho e fizer sentido para o cliente, muitas vezes não existe razão para transformar aquela alteração em um conflito. Por outro lado, quando uma solicitação puder prejudicar significativamente a qualidade, vale explicar os impactos e propor uma alternativa.'},
{t:'h3',c:'Aprenda a propor alternativas'},
{t:'p',c:'Nem toda alteração precisa ser respondida apenas com “sim” ou “não”. Em vez de simplesmente recusar uma mudança, procure entender o objetivo por trás dela e sugerir outra maneira de alcançá-lo.'},
{t:'h3',c:'Saiba quando ceder'},
{t:'p',c:'É importante defender decisões que realmente impactem a qualidade, a identidade ou a funcionalidade da comunicação. Mas também é importante reconhecer quando uma alteração representa apenas uma preferência do cliente e não compromete significativamente o resultado.'},
{t:'citacao',c:'O objetivo não é provar quem está certo. É chegar ao melhor resultado possível.'},
{t:'h3',c:'Aprovações constroem conhecimento sobre o cliente'},
{t:'p',c:'Com o tempo, é possível identificar preferências recorrentes, elementos que costumam gerar resistência, formas de apresentação que funcionam melhor, particularidades da identidade e necessidades que não estão formalizadas em documentos. Esses aprendizados devem circular entre os designers que trabalham com aquela marca.'},
{t:'h3',c:'Evite alterações por interpretação incorreta'},
{t:'p',c:'Quando o feedback permitir diferentes interpretações, uma confirmação rápida pode evitar uma rodada inteira de retrabalho. Isso é especialmente importante em alterações que envolvam mudança de conceito, substituição de imagens, inclusão ou retirada de informações, mudanças significativas de layout, alterações de identidade ou refação completa.'},
{t:'h3',c:'Respeite a versão aprovada'},
{t:'p',c:'Quando uma peça for aprovada, essa versão passa a ser a referência para seus desdobramentos. Evite aproveitar uma adaptação para alterar novamente conceitos, cores, tipografias ou imagens que já passaram pelo processo de aprovação.'},
{t:'p',c:'Caso seja identificada uma oportunidade real de melhoria, ela pode ser discutida, mas não deve ser aplicada silenciosamente.'},
{t:'h3',c:'Aprovação final não elimina a responsabilidade da Criação'},
{t:'p',c:'Mesmo depois que o cliente aprovar uma peça, ainda é responsabilidade da equipe verificar se o arquivo final está correto antes da publicação ou produção.'},
{t:'destaque',c:'Nunca mantenha um erro conhecido apenas porque ele estava presente na versão aprovada.'},
{t:'h3',c:'Mantenha o histórico das decisões'},
{t:'p',c:'As alterações e aprovações relevantes devem permanecer registradas nos canais oficiais. Isso facilita a consulta posterior e ajuda a responder: qual versão foi aprovada? Quem solicitou determinada alteração? Uma informação já havia sido confirmada? Uma decisão visual já havia sido validada?'},
{t:'principio',c:['O processo de aprovação deve ser uma extensão do processo criativo.','Uma boa relação de aprovação não acontece quando o cliente nunca pede alterações. Ela acontece quando as pessoas envolvidas conseguem utilizar o feedback para chegar a um resultado melhor, com clareza, respeito e o mínimo possível de retrabalho.']}
]});

LIVRO.push({id:'alteracoes',t:'Alterações e retrabalho',r:'Como lidar com mudanças sem normalizar o retrabalho evitável.',b:[
{t:'p',c:'Alterações fazem parte da rotina da área de Criação. Nem todo trabalho será aprovado na primeira versão, e nem toda mudança solicitada significa que houve um erro no processo.'},
{t:'p',c:'O retrabalho se torna um problema quando acontece de forma recorrente, desorganizada ou por motivos que poderiam ter sido evitados com mais clareza, alinhamento ou documentação.'},
{t:'h3',c:'Entenda antes de executar'},
{t:'p',c:'Quando o feedback estiver genérico, contraditório ou permitir diferentes interpretações, é melhor esclarecer antes de refazer a peça. Uma alteração mal compreendida pode gerar uma nova rodada de ajustes.'},
{t:'h3',c:'Diferencie ajuste de refação'},
{t:'p',c:'Trocar um texto, ajustar uma imagem ou reposicionar um elemento é diferente de reconstruir uma peça inteira, mudar o conceito ou alterar uma direção visual já aprovada.'},

{t:'h3',c:'Retrabalho evitável deve gerar aprendizado'},
{t:'p',c:'Quando uma alteração acontece porque uma informação não foi conferida ou um briefing foi interpretado de maneira incorreta, o objetivo não deve ser apenas corrigir a peça. Pode ser necessário:'},
{t:'lista',c:['Melhorar o briefing','Registrar uma preferência do cliente','Atualizar um template','Compartilhar uma informação com a equipe','Consultar o histórico da conta','Reforçar alguma etapa de revisão']},
{t:'citacao',c:'O erro só deixa de ser útil quando não gera nenhum aprendizado.'},
{t:'h3',c:'Evite alterar por alterar'},
{t:'p',c:'Quando a Criação perceber que uma alteração pode prejudicar significativamente a qualidade, a legibilidade, a identidade ou a funcionalidade da peça, vale sinalizar isso e propor uma alternativa.'},
{t:'h3',c:'Respeite decisões já aprovadas'},
{t:'p',c:'Se um conceito, uma direção visual ou uma estrutura já foi aprovada, mudanças que contradigam essas decisões precisam ser avaliadas com atenção. Isso evita que o trabalho entre em um ciclo no qual decisões são feitas e desfeitas repetidamente.'},
{t:'h3',c:'Evite múltiplas versões sem controle'},
{t:'p',c:'Sem organização, fica fácil trabalhar sobre uma versão antiga, enviar o arquivo incorreto ou perder uma decisão importante. A equipe precisa conseguir identificar com facilidade:'},
{t:'lista',c:['Qual é a versão mais recente','Qual foi aprovada','Qual está em alteração','Qual arquivo não deve mais ser utilizado']},
{t:'h3',c:'Alterações precisam estar registradas'},
{t:'p',c:'Conversas rápidas podem ajudar a esclarecer uma demanda, mas decisões importantes não devem depender apenas da memória de quem participou de uma reunião. O registro facilita o acompanhamento e protege todas as pessoas envolvidas.'},
{t:'h3',c:'Feedbacks contraditórios precisam ser alinhados'},
{t:'p',c:'Quando diferentes pessoas apresentarem orientações conflitantes, a Criação não deve escolher silenciosamente qual delas seguir. Trabalhar sobre instruções contraditórias aumenta o risco de retrabalho e coloca o profissional em uma posição desnecessariamente vulnerável.'},
{t:'h3',c:'Mudança de briefing é mudança de contexto'},
{t:'p',c:'Mudanças de objetivo, público, mensagem, formato ou conceito podem exigir uma nova solução. A equipe deve estar aberta a essas mudanças, mas também precisa ter clareza de que elas podem impactar prazo e volume de trabalho.'},
{t:'h3',c:'Cuidado com alterações feitas em cascata'},
{t:'p',c:'Uma pequena mudança em uma peça principal pode afetar muitos outros materiais. Por isso, antes de iniciar desdobramentos em escala, é importante garantir que os elementos principais estejam suficientemente alinhados.'},
{t:'h3',c:'Retrabalho não deve ser normalizado'},
{t:'p',c:'Se uma conta apresenta muitas rodadas de alteração com frequência, vale observar o padrão. Talvez exista algum problema de comunicação, briefing, aprovação, expectativa ou conhecimento sobre o cliente que precise ser tratado de maneira mais ampla.'},
{t:'h3',c:'Não tenha receio de recomeçar quando necessário'},

{t:'h3',c:'Compartilhe padrões de alteração'},
{t:'p',c:'Se determinado tipo de imagem sempre é recusado, se existe uma preferência de composição ou se alguma regra específica aparece constantemente nos feedbacks, esse conhecimento pode evitar alterações futuras. O histórico de retrabalho também faz parte da memória da conta.'},
{t:'principio',c:['O objetivo não é evitar alterações a qualquer custo, mas garantir que aconteçam por motivos que realmente façam sentido.','Quando o retrabalho acontece, a equipe deve buscar não apenas corrigir a peça, mas entender como tornar o próximo processo melhor.']}
]});

LIVRO.push({id:'drive',t:'Organização do Google Drive',r:'Onde cada coisa mora, como nomear arquivos e por que a organização é um sistema coletivo.',b:[
{t:'p',c:'O Google Drive funciona como parte da memória da área de Criação. É nele que ficam concentrados arquivos, referências, materiais aprovados, planejamentos, apresentações, identidades visuais e conteúdos que podem ser necessários novamente no futuro.'},
{t:'h3',c:'Organize pensando em quem vem depois'},
{t:'p',c:'Uma boa organização deve permitir que qualquer pessoa da equipe consiga localizar um arquivo sem depender de quem o criou. Ao salvar materiais, pense se outra pessoa conseguiria encontrar aquele conteúdo semanas ou meses depois sem precisar pedir ajuda.'},
{t:'h3',c:'Evite estruturas pessoais demais'},

{t:'h3',c:'A pasta de entrega deve estar vinculada à task'},
{t:'p',c:'O Atendimento é responsável por inserir, dentro de cada task, o link da pasta de entrega correspondente àquela demanda. Dessa forma, o profissional de Criação acessa diretamente pela task o local correto onde os arquivos finais precisam ser salvos. Isso evita:'},
{t:'lista',c:['Buscas desnecessárias no Drive','Arquivos salvos em pastas incorretas','Duplicação de pastas','Dificuldade para localizar entregas posteriormente','Dependência de mensagens paralelas para descobrir onde o material deve ser armazenado']},
{t:'h3',c:'O nome do arquivo deve seguir o nome da task'},

{t:'destaque',c:'O princípio é simples: <b>o nome da task deve ser também o nome-base do arquivo</b>. Evite criar abreviações pessoais, apelidos ou nomenclaturas diferentes da utilizada oficialmente na tarefa.'},
{t:'h3',c:'Salve no local correto'},
{t:'p',c:'Arquivos oficiais não devem ficar espalhados em pastas pessoais, áreas temporárias ou locais sem relação com a conta. Isso vale especialmente para arquivos aprovados, apresentações, planejamentos, materiais enviados pelo cliente, referências importantes, documentos institucionais, arquivos finais e materiais que podem ser reutilizados.'},
{t:'h3',c:'Não transforme o Drive em depósito'},
{t:'p',c:'Organizar não significa simplesmente salvar tudo. Arquivos duplicados, versões temporárias, downloads e materiais sem utilidade podem dificultar a busca tanto quanto a falta de organização.'},
{t:'h3',c:'Separe o que está em uso do que é histórico'},
{t:'p',c:'Campanhas antigas, identidades anteriores e projetos encerrados podem continuar sendo importantes como referência, mas não devem gerar dúvida sobre o que está vigente. Diferencie claramente materiais atuais, materiais aprovados, projetos encerrados, histórico e arquivos antigos.'},
{t:'h3',c:'Não deixe conhecimento apenas no computador'},
{t:'p',c:'Um arquivo que existe apenas no computador de um profissional não está realmente disponível para a equipe. Isso é especialmente importante antes de férias, ausências, mudança de conta, troca de profissional ou encerramento de projeto.'},
{t:'citacao',c:'O fluxo da agência não deve depender da disponibilidade de uma única pessoa.'},
{t:'h3',c:'Materiais enviados pelo cliente também devem ser organizados'},
{t:'p',c:'Arquivos recebidos por e-mail, WhatsApp ou reuniões podem ser importantes durante muito tempo. Quando forem relevantes para a produção ou para o histórico da conta, devem ser direcionados ao local adequado no Drive.'},
{t:'h3',c:'Mantenha os materiais de identidade fáceis de encontrar'},
{t:'p',c:'Brandbooks, logos, fontes, elementos gráficos, key visuals e guias de fotografia precisam estar em locais de fácil acesso. Quando houver atualização de identidade, deixe claro qual versão está vigente.'},
{t:'h3',c:'Faça pequenas manutenções'},
{t:'check',titulo:'Ao finalizar um projeto, confira',c:['Os arquivos importantes estão no local correto','O nome dos arquivos corresponde à task','As versões aprovadas estão identificadas','Materiais temporários não estão causando confusão','A pasta de entrega está organizada','Outra pessoa conseguiria localizar aquele trabalho futuramente']},
{t:'h3',c:'Evite criar novas estruturas sem necessidade'},
{t:'p',c:'Antes de criar uma nova pasta, verifique se já existe um local destinado àquele tipo de material. Criar estruturas paralelas para resolver o mesmo problema fragmenta a informação e aumenta a dificuldade de localização.'},
{t:'principio',c:['O sistema de gestão e o Google Drive precisam funcionar de forma conectada. A task deve indicar onde o arquivo será entregue, e o arquivo deve carregar a mesma nomenclatura da task.','O objetivo não é criar a estrutura mais complexa possível, mas garantir que qualquer pessoa da equipe consiga encontrar, entender e continuar um trabalho com facilidade.']}
]});

LIVRO.push({id:'arquivo-aberto',t:'Arquivo aberto',r:'O patrimônio de produção da Criação: o que preservar, em que condição e por quê.',b:[
{t:'p',c:'Os arquivos abertos fazem parte do patrimônio de produção da área de Criação. Eles permitem que uma peça seja ajustada, adaptada, reaproveitada ou retomada futuramente sem a necessidade de reconstruir um trabalho do zero.'},
{t:'h3',c:'Todo trabalho relevante deve ter seu arquivo aberto preservado'},
{t:'p',c:'Sempre que uma peça possuir potencial de adaptação, continuidade ou consulta futura, seu arquivo aberto deve ser mantido. Isso vale principalmente para:'},
{t:'lista',c:['Campanhas','Key visuals','Peças de social media','Apresentações','Materiais gráficos','Materiais institucionais','Identidades visuais','Templates','Peças de performance','Materiais audiovisuais editáveis']},
{t:'h3',c:'O arquivo precisa estar utilizável'},
{t:'p',c:'Guardar um arquivo aberto não significa apenas salvar qualquer versão do projeto. Sempre que possível, evite deixar arquivos com:'},
{t:'lista',c:['Links quebrados','Imagens ausentes','Elementos importantes fora da prancheta','Camadas completamente desorganizadas','Objetos sem identificação quando isso dificultar a continuidade','Versões antigas misturadas sem necessidade','Recursos externos impossíveis de localizar']},
{t:'destaque',c:'O arquivo não precisa estar perfeito internamente, mas precisa ser compreensível e funcional.'},
{t:'h3',c:'Organize pensando em outra pessoa'},
{t:'citacao',c:'Se outra pessoa precisar abrir esse arquivo amanhã, ela conseguirá entender o projeto?'},
{t:'p',c:'Um arquivo excessivamente desorganizado pode consumir quase tanto tempo quanto reconstruir parte da peça. Principalmente em projetos maiores, vale manter uma organização mínima de pranchetas, camadas, grupos, links, elementos recorrentes e versões.'},
{t:'h3',c:'Não achate arquivos sem necessidade'},
{t:'p',c:'Textos, vetores, objetos, imagens e demais componentes devem continuar acessíveis para futuras alterações. Quando houver necessidade de criar uma versão fechada ou simplificada, preserve também o arquivo editável original.'},
{t:'h3',c:'Preserve os materiais vinculados'},
{t:'p',c:'Fotografias, vídeos, fontes, áudios e ilustrações podem precisar ser mantidos junto ao projeto. É importante evitar situações em que o arquivo aberto exista, mas metade de seus componentes esteja perdida em pastas pessoais ou na pasta de Downloads.'},
{t:'h3',c:'Fontes também precisam de atenção'},
{t:'p',c:'Nem todas as fontes utilizadas em um projeto podem ser compartilhadas livremente. Quando houver tipografias licenciadas, é importante respeitar suas condições de uso. Quando fizer sentido, podem ser mantidas versões de referência com textos convertidos em vetor, sem substituir o arquivo editável original.'},
{t:'h3',c:'Arquivos de Adobe'},
{t:'tabela',cab:['Software','Formato aberto'],linhas:[
['Illustrator','<code>.AI</code>'],['Photoshop','<code>.PSD</code>'],['InDesign','<code>.INDD</code>'],['After Effects','<code>.AE</code> ou projeto correspondente'],['Premiere','<code>.PRPROJ</code>']
]},
{t:'h3',c:'Figma e ferramentas em nuvem'},
{t:'p',c:'O arquivo já existe em ambiente compartilhado, mas ainda precisa estar organizado e acessível. Evite criar projetos importantes exclusivamente em contas pessoais ou espaços que não possam ser acessados pela equipe.'},
{t:'h3',c:'Arquivos audiovisuais exigem atenção especial'},
{t:'p',c:'Projetos de vídeo costumam depender de uma quantidade maior de materiais externos: vídeos brutos, trilhas, locuções, imagens e gráficos. Um projeto de edição sem os arquivos utilizados pode se tornar praticamente inutilizável.'},
{t:'h3',c:'Não dependa apenas do seu computador'},
{t:'p',c:'Arquivos locais podem ser utilizados durante a produção, mas o material relevante precisa estar disponível na estrutura oficial da agência. Essa preocupação se torna ainda mais importante em férias, ausências, mudanças de equipe, desligamentos, troca de responsável por uma conta ou demandas urgentes.'},
{t:'h3',c:'Preserve o que pode gerar valor no futuro'},
{t:'p',c:'Nem todo rascunho precisa ser guardado para sempre. Vale preservar principalmente aquilo que pode servir como base para adaptações, referência, histórico, template, material de campanha, fonte de elementos ou continuidade de uma identidade.'},
{t:'h3',c:'Não exclua arquivos importantes sem alinhamento'},
{t:'p',c:'Arquivos antigos podem parecer desnecessários para quem está trabalhando na conta naquele momento, mas ainda possuir valor histórico ou estratégico. Quando houver dúvida, preservar de forma organizada costuma ser uma escolha mais segura do que eliminar.'},
{t:'h3',c:'Ao encerrar ou transferir uma conta'},
{t:'p',c:'Quando houver troca de responsável por um cliente, os arquivos abertos relevantes precisam estar acessíveis para quem assumirá a conta. É importante evitar que a transição aconteça apenas por meio de conversas — campanhas recentes, templates, apresentações e arquivos-base devem estar disponíveis e organizados.'},
{t:'principio',c:['O arquivo final é aquilo que o cliente vê. O arquivo aberto é aquilo que permite que a agência continue trabalhando.','Um bom arquivo aberto deve permitir que o trabalho continue mesmo quando quem o criou não estiver mais envolvido naquela demanda.']}
]});

(function(){
  "use strict";

  var ESCOPOS=[
    {o:"Interpretação de briefings",a:["Criação","Atendimento"]},
    {o:"Criação de peças gráficas para redes sociais",a:["Criação","Redação","Social Media"]},
    {o:"Desenvolvimento de conceitos visuais",a:["Criação"]},
    {o:"Desdobramento e adaptação de materiais",a:["Criação"]},
    {o:"Aplicação e preservação da identidade visual",a:["Criação"]},
    {o:"Tratamento e seleção de imagens",a:["Criação"]},
    {o:"Diagramação e organização de informações",a:["Criação","Redação"]},
    {o:"Revisão técnica e controle de qualidade",a:["Criação","Atendimento"]},
    {o:"Alterações e ajustes",a:["Criação"]},
    {o:"Preparação, fechamento e entrega de arquivos",a:["Criação"]},
    {o:"Organização e arquivamento",a:["Criação"]},
    {o:"Gestão de prazos e prioridades",a:["Atendimento","Criação"]},
    {o:"Comunicação com outras áreas para desenvolvimento de artes",a:["Criação"]},
    {o:"Pesquisar tendências visuais",a:["Criação"]},
    {o:"Edição, planejamento e desenvolvimento de materiais audiovisuais",a:["Criação"]},
    {o:"Desenvolvimento de criativos de performance",a:["Criação","Redação"]}
  ];

  var CLIENTES=[
    ["Mundo Verde e Lojas Próprias","Giovanna Oliveira Marino e Giovanna Belucci","Campanhas periódicas, KVs, posts de redes sociais, desdobramentos de peças, criativos de performance, banner site, e-mail marketing, solicitações de franqueados e material audiovisual","Gabriela / Lívia"],
    ["ABF Expo","Victor Hugo Fávaro","Peças de comunicação visual, KV anual, posts de redes sociais, criativos de performance, desdobramentos e material audiovisual","Gabriela"],
    ["Itatiba Mall","Marcela Setta","Posts de redes sociais e materiais gráficos diversos, além de identidade visual e desdobramentos","Mariela"],
    ["Loctok","Marcela Setta","Posts de redes sociais","Lívia"],
    ["4Real","Marcela Setta","Posts de redes sociais","Gabriela"],
    ["Mapho","Marcela Setta","Posts de redes sociais","Gabriela"],
    ["Full Connect Key","Victor Hugo Fávaro e Marcela Setta","Material institucional digital e impresso, e posts de redes sociais","Gabriela"],
    ["Franquias Brasil","Victor Hugo Fávaro","KV, identidade visual, posts de redes sociais, criativos de performance, desdobramentos e material audiovisual","Mariela"],
    ["Fisa","Victor Hugo Fávaro","Criativos de performance, desdobramentos e material audiovisual","Mariela"],
    ["Brasil Windpower","Victor Hugo Fávaro","Criativos de performance, desdobramentos e material audiovisual","Mariela"]
  ];

  var CHAVE="fck-criacao-v1";
  function $(s,r){return (r||document).querySelector(s)}
  function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
  function nn(i){return String(i+1).padStart(2,"0")}

  /* ---------- estado ---------- */
  function ler(){try{var c=localStorage.getItem(CHAVE);return c?JSON.parse(c):{lidos:[],checks:{}}}catch(e){return {lidos:[],checks:{}}}}
  function gravar(s){try{localStorage.setItem(CHAVE,JSON.stringify(s))}catch(e){}}
  var estado=ler();
  if(!Array.isArray(estado.lidos))estado.lidos=[];
  if(!estado.checks||typeof estado.checks!=="object")estado.checks={};

  /* ---------- render ---------- */
  var main=$("#main"), sumario=$("#sumario");

  function blocoHTML(b,capId,idx){
    switch(b.t){
      case 'p': return '<p>'+b.c+'</p>';
      case 'h3': return '<h3>'+esc(b.c)+'</h3>';
      case 'lista': return '<ul>'+b.c.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>';
      case 'numerada': return '<ol>'+b.c.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol>';
      case 'destaque': return '<div class="destaque">'+b.c+'</div>';
      case 'citacao': return '<p class="citacao">'+esc(b.c)+'</p>';
      case 'nota': return '<div class="nota"><span class="tag">Atualizar</span><p>'+b.c+'</p></div>';
      case 'principio': return '<div class="principio"><div class="rot">Princípio geral</div>'+b.c.map(function(x){return '<p>'+x+'</p>'}).join('')+'</div>';
      case 'check': return checkHTML(b,capId,idx);
      case 'tabela': return tabelaHTML(b);
      case 'matriz': return matrizHTML();
      case 'clientes': return clientesHTML();
      default: return '';
    }
  }

  function checkHTML(b,capId,idx){
    var base=capId+'-'+idx;
    var itens=b.c.map(function(x,i){
      var id=base+'-'+i, on=estado.checks[id]?' checked':'';
      return '<li><label><input type="checkbox" data-ck="'+id+'"'+on+'><span>'+x+'</span></label></li>';
    }).join('');
    return '<div class="check" data-base="'+base+'">'
      +'<div class="check-topo"><span>'+esc(b.titulo||'Checklist')+'</span><button type="button" data-limpar="'+base+'">Limpar</button></div>'
      +'<ul>'+itens+'</ul></div>';
  }

  function tabelaHTML(b){
    return '<div class="tab-rolo"><table><thead><tr>'
      +b.cab.map(function(h){return '<th>'+esc(h)+'</th>'}).join('')
      +'</tr></thead><tbody>'
      +b.linhas.map(function(l){return '<tr>'+l.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')
      +'</tbody></table></div>';
  }

  function matrizHTML(){
    var solo=ESCOPOS.filter(function(e){return e.a.length===1}).length;
    var html='<div class="stats">'
      +'<div class="stat"><b>'+ESCOPOS.length+'</b><span>Escopos</span></div>'
      +'<div class="stat"><b>'+solo+'</b><span>Só da Criação</span></div>'
      +'<div class="stat"><b>'+(ESCOPOS.length-solo)+'</b><span>Compartilhados</span></div>'
      +'</div>';
    html+='<div class="filtros" role="group" aria-label="Filtrar por área"><span class="rot">Filtrar</span>'
      +['todas','Criação','Atendimento','Redação','Social Media'].map(function(f){
        return '<button class="chip" type="button" data-f="'+esc(f)+'" aria-pressed="'+(f==='todas')+'">'+(f==='todas'?'Todas':esc(f))+'</button>'
      }).join('')+'</div>';
    html+='<div class="matriz" id="matriz">'+ESCOPOS.map(function(e){
      return '<div class="linha" data-areas="'+esc(e.a.join('|'))+'"><div class="oq">'+esc(e.o)+'</div><div class="areas">'
        +e.a.map(function(a){return '<button type="button" class="area'+(a==='Criação'?' pri':'')+'" data-area="'+esc(a)+'">'+esc(a)+'</button>'}).join('')
        +'</div></div>';
    }).join('')+'</div>';
    return html;
  }

  function clientesHTML(){
    return tabelaHTML({cab:['Cliente','Diretor de Arte','Materiais desenvolvidos','Atendimento'],linhas:CLIENTES.map(function(l){return l.map(esc)})});
  }

  function montar(){
    main.innerHTML = LIVRO.map(function(cap,i){
      var corpo = cap.b.map(function(b,j){return blocoHTML(b,cap.id,j)}).join('');
      return '<section class="cap" id="'+cap.id+'">'
        +'<div class="cap-topo"><div class="cap-n">Capítulo '+nn(i)+'</div><h2>'+esc(cap.t)+'</h2>'
        +(cap.r?'<p class="resumo">'+esc(cap.r)+'</p>':'')+'</div>'
        +'<div class="bloco">'+corpo+'</div>'
        +'<button class="marcar" type="button" data-cap="'+cap.id+'" aria-pressed="false"><span class="cx" aria-hidden="true"></span><span>Marcar como lido</span></button>'
        +'</section>';
    }).join('');

    sumario.innerHTML = LIVRO.map(function(cap,i){
      return '<li><a href="#'+cap.id+'" data-cap="'+cap.id+'"><span class="nn">'+nn(i)+'</span><span>'+esc(cap.t)+'</span></a></li>';
    }).join('');

    $("#m-caps").textContent = LIVRO.length;
    var palavras = JSON.stringify(LIVRO).split(/\s+/).length;
    $("#m-tempo").textContent = Math.max(1,Math.round(palavras/200)) + " min";
  }

  /* ---------- lidos ---------- */
  function pintarLidos(){
    $$("[data-cap]").forEach(function(el){
      var id=el.getAttribute("data-cap"), on=estado.lidos.indexOf(id)!==-1;
      if(el.classList.contains("marcar")){
        el.setAttribute("aria-pressed",String(on));
        $(".cx",el).textContent = on?"✓":"";
        el.lastElementChild.textContent = on?"Lido":"Marcar como lido";
      } else {
        el.classList.toggle("lido",on);
      }
    });
    $("#contagem").textContent = estado.lidos.length+" de "+LIVRO.length+" lidos";
  }

  /* ---------- eventos ---------- */
  document.addEventListener("click",function(ev){
    var m=ev.target.closest(".marcar");
    if(m){
      var id=m.getAttribute("data-cap"), i=estado.lidos.indexOf(id);
      if(i===-1)estado.lidos.push(id);else estado.lidos.splice(i,1);
      gravar(estado); pintarLidos(); return;
    }
    var chip=ev.target.closest(".chip");
    if(chip){ filtrar(chip.getAttribute("data-f")); return; }
    var area=ev.target.closest(".area");
    if(area){ filtrar(area.getAttribute("data-area")); return; }
    var limpar=ev.target.closest("[data-limpar]");
    if(limpar){
      var base=limpar.getAttribute("data-limpar");
      $$('input[data-ck^="'+base+'"]').forEach(function(c){c.checked=false;delete estado.checks[c.getAttribute("data-ck")]});
      gravar(estado); return;
    }
  });

  document.addEventListener("change",function(ev){
    var ck=ev.target.closest("input[data-ck]");
    if(!ck)return;
    var id=ck.getAttribute("data-ck");
    if(ck.checked)estado.checks[id]=1; else delete estado.checks[id];
    gravar(estado);
  });

  $("#zerar").addEventListener("click",function(){
    estado={lidos:[],checks:{}}; gravar(estado);
    $$("input[data-ck]").forEach(function(c){c.checked=false});
    pintarLidos();
  });

  function filtrar(area){
    var mz=$("#matriz"); if(!mz)return;
    $$(".linha",mz).forEach(function(l){
      l.hidden = area!=="todas" && l.getAttribute("data-areas").split("|").indexOf(area)===-1;
    });
    $$(".chip").forEach(function(c){c.setAttribute("aria-pressed",String(c.getAttribute("data-f")===area))});
  }

  /* ---------- busca ---------- */
  var q=$("#q"), caixa=$("#resultados");
  function textoDoBloco(b){
    if(typeof b.c==="string")return b.c;
    if(Array.isArray(b.c))return b.c.join(" ");
    return "";
  }
  q.addEventListener("input",function(){
    var termo=q.value.trim().toLowerCase();
    if(termo.length<3){caixa.hidden=true;caixa.innerHTML="";return}
    var achados=[];
    LIVRO.forEach(function(cap,i){
      cap.b.forEach(function(b){
        var txt=textoDoBloco(b).replace(/<[^>]+>/g," ");
        var p=txt.toLowerCase().indexOf(termo);
        if(p!==-1 && achados.length<24){
          var ini=Math.max(0,p-45), fim=Math.min(txt.length,p+termo.length+65);
          var trecho=(ini>0?"…":"")+txt.slice(ini,fim)+(fim<txt.length?"…":"");
          achados.push({id:cap.id,cap:nn(i)+" · "+cap.t,trecho:trecho,termo:termo});
        }
      });
    });
    if(!achados.length){caixa.innerHTML='<p class="sem-res">Nada encontrado.</p>';caixa.hidden=false;return}
    caixa.innerHTML=achados.map(function(a){
      var t=esc(a.trecho);
      var re=new RegExp("("+a.termo.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
      return '<button class="res" type="button" data-ir="'+a.id+'"><b>'+esc(a.cap)+'</b><small>'+t.replace(re,"<mark>$1</mark>")+'</small></button>';
    }).join('');
    caixa.hidden=false;
  });
  caixa.addEventListener("click",function(ev){
    var r=ev.target.closest("[data-ir]"); if(!r)return;
    var alvo=document.getElementById(r.getAttribute("data-ir"));
    if(alvo)alvo.scrollIntoView({behavior:"smooth",block:"start"});
    caixa.hidden=true; q.value="";
    if(estreito.matches)fecharRail();
  });
  q.addEventListener("keydown",function(e){if(e.key==="Escape"){q.value="";caixa.hidden=true}});

  /* ---------- rail no telefone ---------- */
  var painel=$("#painel-rail"), btnRail=$("#abrir-rail");
  var estreito=window.matchMedia("(max-width: 980px)");
  function fecharRail(){btnRail.setAttribute("aria-expanded","false");btnRail.textContent="Abrir";ajustar()}
  function ajustar(){
    if(estreito.matches){
      var ab=btnRail.getAttribute("aria-expanded")==="true";
      painel.style.display = ab?"contents":"none";
    } else { painel.style.display="contents"; }
  }
  btnRail.addEventListener("click",function(){
    var ab=btnRail.getAttribute("aria-expanded")==="true";
    btnRail.setAttribute("aria-expanded",String(!ab));
    btnRail.textContent=ab?"Abrir":"Fechar";
    ajustar();
  });
  sumario.addEventListener("click",function(ev){ if(ev.target.closest("a")&&estreito.matches)fecharRail() });
  if(estreito.addEventListener)estreito.addEventListener("change",ajustar);

  /* ---------- progresso e capítulo ativo ---------- */
  var barra=$("#barra i");
  function aoRolar(){
    var alt=document.documentElement.scrollHeight-window.innerHeight;
    barra.style.width=(alt>0?Math.min(100,Math.max(0,window.scrollY/alt*100)):0)+"%";
    var caps=$$(".cap"), atual=caps[0];
    caps.forEach(function(s){ if(s.getBoundingClientRect().top<=150)atual=s });
    if(!atual)return;
    $$(".sumario a").forEach(function(a){
      var on=a.getAttribute("href")==="#"+atual.id;
      a.classList.toggle("ativo",on);
      if(on && !estreito.matches){
        var r=a.getBoundingClientRect(), c=sumario.getBoundingClientRect();
        if(r.top<c.top||r.bottom>c.bottom)a.scrollIntoView({block:"nearest"});
      }
    });
  }
  var pend=false;
  window.addEventListener("scroll",function(){
    if(pend)return; pend=true;
    requestAnimationFrame(function(){aoRolar();pend=false});
  },{passive:true});
  window.addEventListener("resize",aoRolar,{passive:true});

  montar(); pintarLidos(); ajustar(); aoRolar();
})();
</script>

<!--
  ===========================================================================
  A PONTE COM O FULL HUB (0102)

  Este bloco é acrescentado ao e-book quando ele entra no acervo, e **ele não
  muda nada do que está acima**: o documento continua funcionando sozinho, no
  navegador, sem o Full Hub. O que ele faz é espelhar para fora o que já é
  gravado no `localStorage`, e aceitar de fora o estado que o banco guardou.

  ELE SE DESLIGA SOZINHO FORA DO PAINEL -- `window.parent === window` quer
  dizer que não há host, e aí ele devolve sem registrar nada. É por isso que o
  mesmo arquivo serve para abrir solto e para abrir dentro do Full Hub.
  ===========================================================================
-->
<script>
(function(){
  if (window.parent === window) return;
  var CHAVE = "fck-criacao-v1";

  function estado(){
    try { return JSON.parse(localStorage.getItem(CHAVE)) || {lidos:[],checks:{}}; }
    catch(e){ return {lidos:[],checks:{}}; }
  }
  function enviar(m){ try { window.parent.postMessage(m, "*"); } catch(e){} }

  /* O ESTADO VEM DO BANCO E A PÁGINA SE RECARREGA UMA VEZ, antes de a pessoa
     tocar em nada: é assim que ela reaplica o que já foi lido sem reescrever
     o render inteiro. O host manda isto UMA vez por carregamento -- se ele
     respondesse ao `pronto` que nasce do próprio recarregamento, seria laço. */
  window.addEventListener("message", function(ev){
    if (ev.source !== window.parent) return;
    var d = ev.data;
    if (!d || d.tipo !== "fullhub:estado") return;
    try {
      localStorage.setItem(CHAVE, JSON.stringify({
        lidos: Array.isArray(d.lidos) ? d.lidos : [],
        checks: (d.checks && typeof d.checks === "object") ? d.checks : {}
      }));
      location.reload();
    } catch(e){}
  });

  /* O ESPELHO É UM OUVINTE NA FASE DE CAPTURA, no documento inteiro: ele não
     depende de qual elemento o render criou nem de quando, então acrescentar
     um capítulo ao LIVRO não exige mexer aqui. */
  document.addEventListener("change", function(e){
    var alvo = e.target;
    if (!alvo || !alvo.hasAttribute) return;

    if (alvo.hasAttribute("data-cap")) {
      enviar({ tipo:"fullhub:capitulo", chave: alvo.getAttribute("data-cap"), lido: !!alvo.checked });

      /* O TOTAL É CONTADO NA PÁGINA, e não escrito como 23: o número é o de
         capítulos que ESTE arquivo tem, e uma constante aqui mentiria na
         versão em que alguém acrescentar o vigésimo quarto -- sem erro em
         lugar nenhum, só a conclusão que nunca mais dispara. */
      var total = document.querySelectorAll('input[data-cap]').length;
      var s = estado();
      if (total > 0 && s.lidos.length >= total) enviar({ tipo:"fullhub:concluido" });
      return;
    }

    if (alvo.hasAttribute("data-ck")) {
      var id = alvo.getAttribute("data-ck");
      var base = id.split("-").slice(0, -1).join("-");
      var marcados = [];
      Array.prototype.forEach.call(
        document.querySelectorAll('input[data-ck^="' + base + '-"]'),
        function(c){ if (c.checked) marcados.push(c.getAttribute("data-ck")); }
      );
      enviar({ tipo:"fullhub:checklist", chave: base, marcados: marcados });
    }
  }, true);

  enviar({ tipo:"fullhub:pronto" });
})();
</script>
